<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone - Remote Video Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#141414] text-white">
    <!-- Header -->
    <header class="fixed w-full top-0 z-50 bg-gradient-to-b from-black to-transparent">
        <nav class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="text-[#E50914] text-4xl font-bold">NETFLIX</div>
            <div class="flex items-center gap-4">
                <button class="bg-[#E50914] px-4 py-2 rounded">Sign In</button>
            </div>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="relative h-screen">
        <div class="absolute inset-0 bg-black/60"></div>
        <img src="https://assets.nflxext.com/ffe/siteui/vlv3/fa7be975-efc3-48c6-8188-f07fdd1aa476/web/US-en-20250428-TRIFECTA-perspective_faab2a97-6c57-47de-ba17-78563803a67b_large.jpg" 
             alt="Hero Background" 
             class="w-full h-full object-cover">
        <div class="absolute inset-0 flex items-center justify-center text-center">
            <div class="max-w-3xl px-4">
                <h1 class="text-5xl font-bold mb-4">Watch Your Videos Anywhere</h1>
                <p class="text-xl mb-8">Drop your videos in the folder and stream them instantly</p>
            </div>
        </div>
    </section>

    <!-- Video Grid Section -->
    <section class="container mx-auto px-4 py-16">
        <h2 class="text-3xl font-bold mb-8">Available Videos</h2>
        <!-- Loading Spinner -->
        <div id="loading-spinner" data-testid="loading-spinner" class="loading-spinner hidden mx-auto mb-8"></div>
        <div id="video-grid" data-testid="video-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
            <!-- Videos will be dynamically inserted here -->
        </div>
    </section>

    <!-- Video Modal -->
    <div id="video-modal" class="fixed inset-0 bg-black/90 hidden z-50">
        <div class="absolute top-4 right-4">
            <button id="close-modal" data-testid="close-modal" class="text-white text-2xl">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="h-full flex items-center justify-center">
            <div class="w-full max-w-6xl px-4">
                <div class="relative">
                    <video id="video-player" class="w-full">
                        Your browser does not support the video tag.
                    </video>
                    <!-- Custom Video Controls -->
                    <div id="video-controls" class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black p-4">
                        <div class="flex items-center gap-4">
                            <button id="play-pause" data-testid="play-pause" class="text-white text-xl">
                                <i class="fas fa-play"></i>
                            </button>
                            <div class="flex-1">
                                <input type="range" id="seek-bar" class="w-full" value="0">
                            </div>
                            <button id="mute" data-testid="mute" class="text-white text-xl">
                                <i class="fas fa-volume-up"></i>
                            </button>
                            <input type="range" id="volume-bar" class="w-20" min="0" max="1" step="0.1" value="1">
                            <button id="full-screen" data-testid="full-screen" class="text-white text-xl">
                                <i class="fas fa-expand"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
